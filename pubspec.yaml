name: sallae_mallae_app
description: Sallae Mallae Flutter application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  camera: ^0.12.0+1
  permission_handler: ^12.0.3
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/

# Run `dart run flutter_launcher_icons` after `flutter pub get` to generate
# the native iOS/Android launcher icons from these sources.
flutter_launcher_icons:
  ios: true
  image_path_ios: "assets/ios_salmal_last.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  android: true
  image_path_android: "assets/android_salmal_last.png"
